<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Hub</title>
  <meta name="description" content="Índice personal: rutinas de ejercicio y seguimiento multimedia.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="bg" aria-hidden="true">
    <span class="blob b1"></span>
    <span class="blob b2"></span>
    <span class="blob b3"></span>
  </div>

  <button class="theme-toggle" id="themeToggle" aria-label="Cambiar tema" title="Cambiar tema">
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>

  <main class="container">
    <header class="hero">
      <p class="date" id="date"></p>
      <h1><span id="greeting">Hola</span>, Alan</h1>
      <p class="subtitle">¿A dónde vamos hoy?</p>
    </header>

    <section class="cards">
      <a class="card card--fitness" href="https://fitness-h39m.onrender.com" data-wake="https://fitness-h39m.onrender.com">
        <div class="card__icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5v11M17.5 6.5v11M3 9.5v5M21 9.5v5M6.5 12h11"/></svg>
        </div>
        <div class="card__body">
          <h2>Rutinas de ejercicio</h2>
          <p>Planifica tus entrenamientos y registra tu progreso.</p>
          <span class="hint">Puede tardar unos segundos en despertar</span>
        </div>
        <span class="card__arrow" aria-hidden="true">→</span>
      </a>

      <a class="card card--media" href="https://myhub.michelandrade.com/">
        <div class="card__icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M10 9l5 3-5 3z"/></svg>
        </div>
        <div class="card__body">
          <h2>Multimedia</h2>
          <p>Seguimiento de series, películas, libros y más.</p>
        </div>
        <span class="card__arrow" aria-hidden="true">→</span>
      </a>
    </section>

    <footer class="footer">
      <span id="clock"></span>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
